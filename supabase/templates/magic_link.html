<h2>Masuk ke Kompas</h2>
<p>Kode masuk kamu:</p>
<p style="font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
<p>Ketik kode ini di halaman masuk Kompas (berlaku sekali pakai, satu jam). Cara ini juga jalan di app yang terpasang di laptop atau HP.</p>
<p>Kalau sedang di browser, kamu juga bisa <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">ketuk tautan ini</a>.</p>
<p>Kalau kamu tidak meminta kode ini, abaikan email ini.</p>
